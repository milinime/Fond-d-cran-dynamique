<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fond d'écran dynamique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <style>
    /* 🌧 Styles pour l'animation de pluie */
    #rain-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 15;
    }.raindrop {
      position: absolute;
      width: 2px;
      height: 20px;
      background: linear-gradient(to bottom, rgba(173,216,230,0.8), rgba(0,0,255,0.2));
      opacity: 0.9;
      border-radius: 1px;
      transform: translateX(0);
      transition: transform 1.2s linear, top 1.2s linear, opacity 1.2s linear;
      z-index: 16;
    }

    /* 🚀 AJOUT: Style pour le conteneur des heures solaires */
    #sun-times {
      font-size: 0.8em;
      color: rgba(255,255,255,0.8);
      margin-top: 10px;
      padding: 5px;
      background: rgba(0,0,0,0.3);
      border-radius: 5px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="sky">
    <!-- 🖼 Fonds dynamiques -->
    <img id="backgroundA" src="assets/midi.jpg" alt="Fond A">
    <img id="backgroundB" src="assets/midi.jpg" alt="Fond B">

    <!-- ☀ Soleil + halo -->
    <div id="sun-wrapper">
      <img id="sun" src="assets/sun.png" alt="Soleil">
      <!-- 🚀 AJOUT: ID pour le halo du soleil -->
      <div id="sunHalo" class="sun-halo"></div>
    </div>

    <!-- 🌙 Lune + halo -->
    <div id="moon-wrapper">
      <img id="moon" src="assets/moon.png" alt="Lune">
      <!-- 🚀 AJOUT: ID pour le halo de la lune -->
      <div id="moonHalo" class="moon-halo"></div>
    </div>

    <!-- 🕒 Horloge + vent + météo -->
    <div id="top-info">
      <!-- BATTERIE - HTML -->
      <div id="batteryDisplay">
        <div id="batteryIcon">
          <div class="batteryLevel"></div>
        </div>
        <span id="batteryText">--%</span>
      </div>
      <div id="city-name">--</div>
      <div id="clock">00:00:00</div>

      <!-- 💨 Vent -->
      <div id="wind-info">
        <img src="assets/icons/arrow.png" id="wind-arrow" alt="Direction du vent">
        <span id="wind-text">--</span>
      </div>

      <!-- 🌡 Météo -->
      <div id="weather-block">
        <img id="weather-icon" src="assets/weather/default.png" alt="Météo">
        <div style="display: flex; flex-direction: column; align-items: flex-start;">
          <div id="temperature">--</div>
        </div>
      </div>
      <!-- 📶 Vitesse réseau -->
      <div id="network-speed">-- Ko/s</div>
      <div id="exchangeRates">--</div>
            <div id="systemSimple" aria-live="polite" role="status">
  <div id="cpuText">Utilisation du CPU : — %</div>
  <div id="ramText">Utilisation de la RAM : — / —</div>

      <!-- 🚀 AJOUT: Conteneur pour les heures de lever/coucher du soleil -->
      <div id="sun-times">
        Lever du soleil: <span id="sunrise-display">--</span><br>
        Coucher du soleil: <span id="sunset-display">--</span>
      </div>
    </div>

    <!-- 🌧 Pluie -->
  </div>

  <!-- 🌫️ Brouillard météo -->
  <canvas id="fogCanvas"></canvas>
     <div id="rain-container"></div>

  <!-- 📦 Librairie solaire -->
  <script src="script.js"></script>
  <script src="suncalc.min.js"></script>
  <script src="lastnetworkspeed.js"></script>
  <script src="exchangerate.js"></script>
  <script src="ramcpu.js"></script>
  <script src="battery.js"></script>

  <!-- 🧠 Scripts -->
  <script src="meteo.js"></script>
  <script src="astro-toggle.js"></script>
  <script src="fog.js"> </script> <!-- 🌫️ Script brouillard -->
</body>
</html>
